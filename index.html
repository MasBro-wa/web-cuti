<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Cuti Pegawai - Cepat & Real-Time</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .stat-card {
            border-radius: 10px;
            color: white;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }
        .datetime-box {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }
        .clock {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .date {
            font-size: 0.95rem;
            opacity: 0.9;
        }
    </style>
</head>
<body onload="mulaiJam()">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom p-4 bg-white">
                    
                    <!-- Widget Jam & Tanggal Real-Time -->
                    <div class="datetime-box">
                        <div id="currentDate" class="date mb-1">Memuat tanggal...</div>
                        <div id="currentClock" class="clock">00:00:00</div>
                    </div>

                    <h3 class="text-center mb-4 fw-bold text-primary">Sistem Cek Cuti Pegawai Puskesmas Kebandaran</h3>
                     
                    <!-- Form Pencarian NIP -->
                    <div class="input-group mb-4">
                        <input type="text" id="nipPegawai" class="form-control form-control-lg" placeholder="Masukkan NIP Pegawai (Contoh: 198501012010011001)" onkeypress="handleEnter(event)">
                        <button class="btn btn-primary px-4" type="button" id="btnCek" onclick="cekCuti()">Cek Cuti</button>
                    </div>

                    <!-- Loader Cepat -->
                    <div id="loading" class="text-center d-none my-3">
                        <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                        <span class="text-muted ms-2">Mencari data dengan cepat...</span>
                    </div>

                    <!-- Kotak Pesan / Alert -->
                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <!-- Hasil / Dashboard Data Cuti -->
                    <div id="resultSection" class="d-none">
                        <hr>
                        <h5 class="mb-3">Informasi Pegawai</h5>
                        <p class="mb-1"><strong>NIP:</strong> <span id="resNip"></span></p>
                        <p class="mb-4"><strong>Nama Pegawai:</strong> <span id="resNama"></span></p>

                        <h5 class="mb-3">Jumlah Cuti yang Telah Diambil</h5>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="stat-card bg-primary">
                                    <h6>Cuti Tahunan</h6>
                                    <h3 id="resTahunan" class="fw-bold mb-0">0</h3>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="stat-card bg-success">
                                    <h6>Cuti Sakit</h6>
                                    <h3 id="resSakit" class="fw-bold mb-0">0</h3>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="stat-card bg-warning text-dark">
                                    <h6>Cuti Bersalin</h6>
                                    <h3 id="resBersalin" class="fw-bold mb-0">0</h3>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="stat-card bg-danger">
                                    <h6>Cuti Alasan Penting</h6>
                                    <h3 id="resPenting" class="fw-bold mb-0">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Optimasi Kecepatan & Fungsionalitas -->
    <script>
        // --- 1. JAM & TANGGAL REAL-TIME ---
        function mulaiJam() {
            updateWaktu();
            setInterval(updateWaktu, 1000);
        }

        function updateWaktu() {
            const sekarang = new Date();
            const opsiTanggal = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').innerText = sekarang.toLocaleDateString('id-ID', opsiTanggal);
            
            const jam = String(sekarang.getHours()).padStart(2, '0');
            const menit = String(sekarang.getMinutes()).padStart(2, '0');
            const detik = String(sekarang.getSeconds()).padStart(2, '0');
            document.getElementById('currentClock').innerText = `${jam} : ${menit} : ${detik} WIB`;
        }

        // Shortcut tekan tombol "Enter" pada keyboard agar langsung mencari
        function handleEnter(e) {
            if (e.key === 'Enter') {
                cekCuti();
            }
        }

        // --- 2. OPTIMASI KONEKSI KE GOOGLE APPS SCRIPT ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxuNuTtsuOFDp_loQ4EKht9cBMPqx8V9Qm4q8EIS8ha0-Rf4VqpvdImaGoGvKGvpYZc/exec";

        function cekCuti() {
            const nip = document.getElementById('nipPegawai').value.trim();
            const loading = document.getElementById('loading');
            const alertBox = document.getElementById('alertBox');
            const resultSection = document.getElementById('resultSection');
            const btnCek = document.getElementById('btnCek');

            alertBox.className = "alert d-none";
            resultSection.classList.add('d-none');

            if (!nip) {
                alertBox.className = "alert alert-warning";
                alertBox.innerText = "Silakan masukkan NIP Pegawai terlebih dahulu!";
                return;
            }

            // Nonaktifkan tombol dan tampilkan loading kilat
            loading.classList.remove('d-none');
            btnCek.disabled = true;

            // Menggunakan teknik fetch optimal dengan timeout/koneksi langsung
            fetch(`${WEB_APP_URL}?nip=${encodeURIComponent(nip)}`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(response => response.json())
            .then(data => {
                loading.classList.add('d-none');
                btnCek.disabled = false;

                if (data.status === "success") {
                    document.getElementById('resNip').innerText = data.nip;
                    document.getElementById('resNama').innerText = data.nama;
                    document.getElementById('resTahunan').innerText = data.tahunan;
                    document.getElementById('resSakit').innerText = data.sakit;
                    document.getElementById('resBersalin').innerText = data.bersalin;
                    document.getElementById('resPenting').innerText = data.penting;

                    resultSection.classList.remove('d-none');
                } else {
                    alertBox.className = "alert alert-danger";
                    alertBox.innerText = "NIP Pegawai tidak ditemukan di dalam database!";
                }
            })
            .catch(error => {
                loading.classList.add('d-none');
                btnCek.disabled = false;
                alertBox.className = "alert alert-danger";
                alertBox.innerText = "Koneksi terganggu. Pastikan URL Web App benar dan sudah di-deploy dengan akses 'Anyone'.";
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
